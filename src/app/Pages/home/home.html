<!-- Página home -->
<section id="home">
    <div class="informacoes">
        <img src="assets/images/Foto_Perfil.gif" [attr.alt]="'home.altImagemPerfil' | translate" class="fotoPerfil">
        <div class="informacoesSobreMim">
            <h1 class="nome">Lucas Henrique Boaratti Silva</h1>
            <p class="textoInformativo">{{ "home.textoInformativo" | translate }}</p>
        </div>
    </div>
    <!-- Tecnologias -->
    <section id="tecnologias" aria-label="Tecnologias">
        <div class="titulosTecnologias">
            <h2 class="titulo">{{ "home.tituloTecnologias" | translate }}</h2>
            <p class="textoTecnologias">{{ "home.textoTecnologias" | translate }}</p>
        </div>
        <div class="backgroundGalaxia">
            <img src="assets/images/Fundo_Galaxia.png" [attr.alt]="'home.altImagemGalaxia' | translate" class="fundoGalaxia" aria-hidden="true">
            <div class="planetas" *ngFor="let planeta of planetas">
                <button class="planetaBtn" (click)="abrirModal(planeta.id)" [style.top.px]="planeta.y" [style.left.px]="planeta.x" [attr.aria-label]="'Ver informações do planeta ' + planeta.nome">
                    <img [src]="planeta.imagemPlaneta" [alt]="planeta.nome" class="planeta">
                </button>
                <app-planetas-modal [planetaAberto]="planetaAberto" [closeModal]="fecharModal"></app-planetas-modal>
            </div>
        </div>
    </section>
</section>
