<!-- Página sobre mim -->
<main>
    <section id="sobreMim">
        <section class="sobreMimSection">
            <img src="assets/images/Ghost.png" alt="Foto do Ghost de Hollow Knight.">
            <div class="sobre">
                <h2 class="textoSobreMim">{{ 'sobreMim.textoSobreMim' | translate }}</h2>
                <p class="descricaoSobreMim">{{ 'sobreMim.descricaoSobreMim' | translate }}</p>
            </div>
        </section>
        <section class="jogosFavoritos">
            <h2 class="tituloJogosFavoritos">{{ 'sobreMim.tituloJogosFavoritos' | translate }}</h2>
            <div class="carrossel">
                <div class="botaoVoltar">
                    <button type="button" (click)="jogoAnterior()">
                        <img src="assets/images/SetaEsquerda.png" [alt]=" 'sobreMim.altSetaEsquerda' | translate ">
                    </button>
                </div>
                <div class="cardJogos">
                    <!-- Exibe apenas 4 jogos a partir do índice -->
                    <div class="jogos" *ngFor="let jogo of jogos.slice(index, index + jogosPorTela)">
                        <img [src]="jogo.imagem" [alt]="jogo.nome" class="imagemJogo">
                        <span class="nomeJogo">{{ jogo.nome }}</span>
                    </div>
                </div>
                <div class="botaoAvancar">
                    <button type="button" (click)="proximoJogo()">
                        <img src="assets/images/SetaDireita.png" [alt]=" 'sobreMim.altSetaDireita' | translate ">
                    </button>
                </div>
            </div>
        </section>
    </section>
</main>
